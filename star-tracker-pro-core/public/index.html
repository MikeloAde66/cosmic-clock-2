<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Star Tracker Pro Core — Voice Demo</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0b0f19; color: #e2e8f0; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 18px; font-weight: 600; }
  #status { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
  #status.connected { color: #34d399; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 8px 10px; background: #161b2c; border: 1px solid #2d3548; border-radius: 6px; color: #e2e8f0; }
  button { padding: 8px 14px; background: #2563eb; border: none; border-radius: 6px; color: white; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  label { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  #log { list-style: none; padding: 0; font-size: 13px; }
  #log li { padding: 8px 10px; border-bottom: 1px solid #1e2536; }
  #log li .stage { color: #60a5fa; font-weight: 600; margin-right: 6px; }
  #log li.error .stage { color: #f87171; }
</style>
</head>
<body>
<h1>Star Tracker Pro Core — Voice Demo</h1>
<div id="status">connecting…</div>

<form id="queryForm">
  <input id="queryInput" type="text" placeholder='e.g. "go to the Orion Nebula" or "stop"' autocomplete="off" />
  <button type="submit">Send</button>
</form>
<label><input id="speakToggle" type="checkbox" checked /> Speak responses aloud (window.speechSynthesis)</label>

<ul id="log"></ul>

<script>
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const form = document.getElementById('queryForm');
  const input = document.getElementById('queryInput');
  const speakToggle = document.getElementById('speakToggle');

  function log(stage, message, isError) {
    const li = document.createElement('li');
    if (isError) li.className = 'error';
    li.innerHTML = '<span class="stage">' + stage + '</span>' + message;
    logEl.prepend(li);
  }

  function speak(text) {
    if (!speakToggle.checked || typeof window.speechSynthesis === 'undefined') return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(utterance);
  }

  const ws = new WebSocket('ws://' + location.host + '/ws/indi');

  ws.addEventListener('open', () => {
    statusEl.textContent = 'connected';
    statusEl.classList.add('connected');
  });

  ws.addEventListener('close', () => {
    statusEl.textContent = 'disconnected';
    statusEl.classList.remove('connected');
  });

  ws.addEventListener('message', (evt) => {
    let data;
    try {
      data = JSON.parse(evt.data);
    } catch {
      return;
    }

    if (data.type === 'connected') {
      log('connected', data.message);
      return;
    }

    if (data.type === 'voice_status') {
      const isError = data.stage === 'error' || data.stage === 'not_found';
      log(data.stage, data.message, isError);
      if (data.message) speak(data.message);
      return;
    }

    if (data.type === 'indi_telemetry') {
      log('indi:' + (data.property || data.device || ''), data.status || JSON.stringify(data.values || {}));
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    input.value = '';
    log('you', query);
    try {
      const res = await fetch('/api/voice/intent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });
      const result = await res.json();
      if (!res.ok) log('error', result.error || 'Request failed', true);
      // The voice_status WS stream already reports stage-by-stage progress
      // and speaks it; this just guards against a request that failed
      // before intent_router.js ever got to publish anything.
    } catch (err) {
      log('error', err.message, true);
    }
  });
</script>
</body>
</html>
