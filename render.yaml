services:
  - type: web
    name: kali-quantum-service
    runtime: python
    rootDir: quantum-service
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Set manually in the Render dashboard, not here — keeps the secret
      # out of git. Use the same value you then set as QUANTUM_SERVICE_API_KEY
      # in Vercel's project env vars, so the two sides agree.
      - key: QUANTUM_SERVICE_API_KEY
        sync: false
  # Backs Media Flow & Audio Center's ingest button and Radio Central's
  # catalog fetch (see routers/media.py) — persists to the Supabase
  # media_catalog table (supabase/migrations/0006, 0007) and forwards to
  # the n8n Media Matrix webhook. rootDir is the repo root (unlike
  # quantum-service above), since main.py/requirements.txt live there.
  - type: web
    name: media-catalog-service
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Both set manually in the Render dashboard, not here — same
      # keeps-secrets-out-of-git convention as QUANTUM_SERVICE_API_KEY
      # above. Once this service has a real URL, MEDIA_INGEST_SERVICE_URL
      # and MEDIA_CATALOG_SERVICE_URL in Vercel's project env vars need to
      # point at it (see app/api/v1/media/*/route.ts).
      - key: N8N_MEDIA_WEBHOOK_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
  # star-tracker-pro-core: the Alpaca/INDI hardware bridge + voice HUD
  # living in the star-tracker-pro-core/ subdirectory of this repo. Only
  # ever exposes the UI/voice/catalog demo experience once deployed here —
  # the Alpaca (127.0.0.1:11111) and INDI (127.0.0.1:7624) calls inside it
  # target localhost *on whichever machine runs this service*, which on
  # Render has no telescope attached. Real hardware control only works
  # when this runs on the same machine as the mount.
  - type: web
    name: star-tracker-pro-core
    runtime: node
    plan: free
    rootDir: star-tracker-pro-core
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALPACA_HOST
        value: 127.0.0.1
      - key: ALPACA_PORT
        value: 11111
      - key: ALPACA_DEVICE_NUMBER
        value: 0
